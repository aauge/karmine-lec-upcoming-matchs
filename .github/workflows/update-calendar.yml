name: Update KC LEC Calendar

on:
  schedule:
    # Toutes les 6 heures (heure UTC). Ajuste si besoin.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet "Actions"

permissions:
  contents: write

concurrency:
  group: kc-calendar-update
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le calendrier
        run: python3 generate_kc_calendar_lolesports.py

      - name: Déplacer le fichier dans le dossier publié par GitHub Pages
        run: |
          mkdir -p docs
          mv kc_lec.ics docs/kc_lec.ics

      - name: Commit et push si le fichier a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Force le passage sur une vraie branche locale "main"
          # (le checkout précédent peut laisser le dépôt en "detached HEAD")
          git checkout -B main
          git add docs/kc_lec.ics
          if git diff --staged --quiet; then
            echo "Rien à commit."
            exit 0
          fi
          git commit -m "Mise à jour automatique du calendrier KC LEC"
          git pull --rebase origin main
          git push origin main
