name: Update KC LEC Calendar

on:
  schedule:
    # Toutes les 6 heures (heure UTC). Ajuste si besoin.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}   # permet de le lancer manuellement depuis l'onglet "Actions"

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le calendrier
        run: python3 generate_kc_calendar_noauth.py

      - name: Déplacer le fichier dans le dossier publié par GitHub Pages
        run: |
          mkdir -p docs
          mv kc_lec.ics docs/kc_lec.ics

      - name: Commit et push si le fichier a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/kc_lec.ics
          git diff --staged --quiet || git commit -m "Mise à jour automatique du calendrier KC LEC"
          git push
